spring.application.name=integradora

# Pantallas JSP en front-end/WEB-INF/jsp/ (docs/ARQUITECTURA.md, seccion 16).
# Un controller que devuelve "peritajes/peritos/lista" muestra front-end/WEB-INF/jsp/peritajes/peritos/lista.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
# La sesion viaja solo en cookie (sin ";jsessionid=" en las URL)
server.servlet.session.tracking-modes=cookie

# Thymeleaf no resuelve pantallas: en el pom.xml esta la libreria sin el starter, solo para
# las plantillas de PDF y correo (src/main/resources/templates/pdf y templates/correo).

# TEMPORAL (sin base de datos): desactiva la conexion a BD para que la app arranque.
# Quitar estas lineas cuando se configure MySQL (spring.datasource.url, usuario y password).
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
