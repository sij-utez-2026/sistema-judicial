<!DOCTYPE html>
<!--
  TEMPORAL: layout del módulo (bocetos de Docs/figma) mientras no existe el del núcleo
  (templates/nucleo/layout.html). El usuario en sesión, las notificaciones y "Cerrar sesión" son del núcleo.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · SGPJ'">SGPJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/peritajes/css/peritajes.css}" rel="stylesheet">
</head>

<body>

<!-- Menú lateral. En pantallas chicas se abre con el botón del encabezado. -->
<aside th:fragment="menu(seccion)" class="per-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menuPeritajes">
    <div class="offcanvas-body">
        <div class="d-flex justify-content-between align-items-start">
            <div class="per-emblema flex-grow-1">Reservado para<br>emblema oficial</div>
            <button type="button" class="btn-close btn-close-white ms-2 d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#menuPeritajes" aria-label="Cerrar menú"></button>
        </div>
        <div class="per-linea-dorada"></div>
        <div class="per-subtitulo-dorado mt-2">Gestión de Peritajes Judiciales</div>

        <div class="per-etiqueta-menu">Espacio de trabajo</div>
        <!-- Las secciones sin enlace todavía no existen -->
        <nav class="nav flex-column per-menu">
            <span class="nav-link disabled" title="Pendiente">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg>
                Inicio
            </span>
            <a class="nav-link" th:classappend="${seccion == 'peritos'} ? 'active'" th:href="@{/peritajes/peritos}">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="5" r="2.5"/><path d="M1.5 14c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5"/><circle cx="11.5" cy="5.5" r="2"/><path d="M11 9.6c2 .2 3.5 2 3.5 4.4"/></svg>
                Catálogo de Peritos
            </a>
            <span class="nav-link disabled" title="Pendiente">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 4.5h5l1.5 1.5h6.5v7.5h-13z"/></svg>
                Bitácora de Auditoría
            </span>
            <span class="nav-link disabled" title="Pendiente">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 4.5h5l1.5 1.5h6.5v7.5h-13z"/></svg>
                Panel de Carga de Trabajo
            </span>
            <span class="nav-link disabled" title="Pendiente">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg>
                Notificaciones
            </span>
        </nav>

        <!-- TODO núcleo: nombre y rol del usuario en sesión (SesionService) -->
        <div class="per-usuario">
            <div class="d-flex align-items-center gap-2 mb-2">
                <div class="per-avatar">AD</div>
                <div>
                    <div class="fw-semibold">Usuario de prueba</div>
                    <div class="per-subtitulo-dorado">Administrador</div>
                </div>
            </div>
            <!-- TODO núcleo: formulario POST /logout -->
            <button type="button" class="btn per-btn-salir w-100 text-start" disabled>&#8614; Cerrar sesión</button>
        </div>
    </div>
</aside>

<!-- Encabezado blanco -->
<header th:fragment="encabezado" class="per-topbar d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#menuPeritajes" aria-controls="menuPeritajes" aria-label="Abrir menú">&#9776;</button>
    Sistema para Gestión de Peritajes Judiciales
</header>

<!-- Aviso de éxito arriba a la derecha (flash "exito" y "exitoDetalle") -->
<div th:fragment="aviso" class="toast-container position-fixed top-0 end-0 p-3">
    <div th:if="${exito}" class="toast per-aviso border-success" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex p-3 gap-2">
            <span class="text-success fw-bold">&#10003;</span>
            <div class="flex-grow-1">
                <div class="fw-semibold" th:text="${exito}"></div>
                <div class="per-texto-chico" th:if="${exitoDetalle}" th:text="${exitoDetalle}"></div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/peritajes/js/peritos.js}"></script>
    <script>
        // Muestra el aviso de éxito y lo oculta después de 6 segundos
        document.querySelectorAll('.toast').forEach(function (aviso) {
            new bootstrap.Toast(aviso, {delay: 6000}).show();
        });
    </script>
</th:block>

</body>
</html>
